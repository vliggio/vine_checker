<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vine Checker — results</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="view.css" />
    <link rel="stylesheet" href="results.css" />
  </head>
  <body>
    <header>
      <div class="head-row">
        <button id="run" class="primary">Check all now</button>
        <button id="stop" class="ghost hidden">Stop</button>
        <div class="spacer"></div>
        <button id="expand-all" class="ghost" title="Expand or collapse every listed search">Expand all</button>
        <button id="ack-all" class="ghost" title="Mark every listed item as seen">Mark all seen</button>
        <button id="options" class="icon" title="Options">&#9881;</button>
      </div>
      <div id="status" class="status"></div>
      <div id="progress" class="progress hidden"><div id="progress-bar"></div></div>
      <div id="banner" class="banner hidden"></div>
    </header>

    <main id="list"></main>

    <footer id="footer"></footer>

    <script type="module" src="results.js"></script>
  </body>
</html>
