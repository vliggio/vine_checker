name: Bug report
description: Something else is not working
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If sweeps are reporting no items or wrong counts, use the
        **Parser broken** template instead — it asks for the right diagnostics.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import 40 searches
        2. Click "Check all now"
        3. Close the popup, reopen after a minute
        4. Progress shows 0 of 40
    validations:
      required: true

  - type: textarea
    id: worker_log
    attributes:
      label: Service worker console
      description: |
        chrome://extensions → Vine Checker → **service worker** → Console tab.
        Paste any errors. This is where sweep failures show up.
      render: text

  - type: textarea
    id: page_log
    attributes:
      label: Popup or options console
      description: Right-click the popup → Inspect, or open DevTools on the options page.
      render: text

  - type: input
    id: count
    attributes:
      label: How many searches are enabled
      placeholder: "150"

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Sweeping / the run loop
        - Popup
        - Options page
        - Notifications or the toolbar badge
        - Import or export
        - Not sure
    validations:
      required: true

  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "141.0.7390.55"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version or commit
      description: The version on the chrome://extensions card, or the commit you are on.
    validations:
      required: true

  - type: textarea
    id: extensions
    attributes:
      label: Other Amazon-related extensions installed
      description: |
        VineHelper and similar tools modify Vine pages, which occasionally matters.
      placeholder: "VineHelper 3.2"
