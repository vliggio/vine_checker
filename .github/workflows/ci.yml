name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the supported floor (active LTS); 26 is what development happens on
        # and becomes LTS in Oct 2026. Testing the version the maintainer actually
        # runs matters: `node --test test/` passed on 26 while failing on 22 and 24,
        # so a 26-only regression would otherwise reach main unnoticed.
        node: ["24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No install step: the project has no dependencies by design.
      - name: Unit tests
        run: npm test

      - name: Validate manifest
        run: npm run manifest
