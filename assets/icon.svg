<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Vine Checker">
  <title>Vine Checker</title>
  <defs>
    <linearGradient id="vc-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aad70" />
      <stop offset="1" stop-color="#0d6644" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#vc-badge)" />

  <!-- A leaf (vine) carrying a checkmark (checked). The leaf silhouette is what
       keeps the icon recognisable at 16px, where a bare checkmark would not be. -->
  <path d="M 22 106 C 14 56 46 18 114 12 C 108 80 70 106 22 106 Z" fill="#ffffff" />
  <path d="M 40 70 L 56 86 L 88 48" fill="none" stroke="#0d6644" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
